name: than_sound
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

repository: https://github.com/ThanCoder/than_sound.git

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mpv_audio_kit: ^0.4.4
  dart_core_extensions:
    path: /home/thancoder/projects/dart_plugins/dart_core_extensions
  t_widgets:
    path: /home/thancoder/projects/dart_plugins/t_widgets
  # marquee: ^2.3.0
  crypto: ^3.0.7
  cfb_store: ^0.5.0
  # screen_brightness: ^2.1.11
  than_pkg_linux: ^0.1.0
  than_pkg_android: ^0.2.1
  desktop_drop: ^0.7.1
  # lottie: ^3.5.1
  than_audiotag: ^0.0.1
  android_libcpp_shared: ^0.2.0
  audio_session: ^0.2.4
  audio_service: ^0.18.18
  waveform_visualizer: ^1.0.0
  mini_music_visualizer: ^1.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  # dart run change_app_package_name:main than.app.than_player
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons
# dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo/logo.png"

flutter:
  uses-material-design: true



  # To add assets to your application, add an assets section, like this:
